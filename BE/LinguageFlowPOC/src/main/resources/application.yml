server:
  port: ${SERVER_PORT:8080}

camunda:
  saas:
    region: ${CAMUNDA_REGION:fra-1}
    clusterId: ${CAMUNDA_CLUSTER_ID:}
    clientId: ${CAMUNDA_CLIENT_ID:}
    clientSecret: ${CAMUNDA_CLIENT_SECRET:}
    authUrl: ${CAMUNDA_AUTH_URL:https://login.cloud.camunda.io/oauth/token}

zeebe:
  gateway: ${CAMUNDA_CLUSTER_ID:}.${CAMUNDA_REGION:fra-1}.zeebe.camunda.io:443

logging:
  level:
    root: INFO
    lf.linguageflowpoc: DEBUG

pricing:
  base-rate: 0.8
  currency: CZK
  expiration-duration: PT48H
  formality-coefs:
    NEUTRAL: 1.0
    FORMAL: 1.2
    CREATIVE: 1.3
  urgency-coefs:
    NORMAL: 1.0
    RUSH: 1.4
    OVERNIGHT: 1.6
